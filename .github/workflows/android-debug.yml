name: Build Signed Release REEX IDE X

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle/gradle-8.9/bin/gradle --version

      - name: Validate project
        run: gradle tasks --no-daemon --stacktrace

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/reex-ide-x-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/REEX-IDE-X-1.1.0-release.apk"
          KEYSTORE="$RUNNER_TEMP/reex-release.keystore"

          test -f "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias reex_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass reex-release-password \
            -keypass reex-release-password \
            -dname "CN=REEX IDE X, OU=REEX, O=REEX, L=World, ST=NA, C=US"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias reex_release \
            --ks-pass pass:reex-release-password \
            --key-pass pass:reex-release-password \
            --out "$SIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          sha256sum "$SIGNED"
          ls -lh "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: reex-ide-x-signed-release-1.1.0
          path: app/build/outputs/apk/release/REEX-IDE-X-1.1.0-release.apk
          if-no-files-found: error
