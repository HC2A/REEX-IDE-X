name: Build Signed Release REEX IDE X

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" /opt/android-sdk /usr/local/lib/android -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK manager: $SDKMANAGER"

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle/gradle-8.9/bin/gradle --version

      - name: Validate project
        run: gradle tasks --no-daemon --stacktrace

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          RELEASE_DIR="app/build/outputs/apk/release"
          UNSIGNED="$RELEASE_DIR/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="$RELEASE_DIR/app-release.apk"
          fi
          ALIGNED="$RUNNER_TEMP/reex-release-aligned.apk"
          SIGNED="$RELEASE_DIR/REEX-IDE-X-1.2.0-release.apk"
          KEYSTORE="$RUNNER_TEMP/reex-release.keystore"

          test -f "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias reex_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass reex-release-password \
            -keypass reex-release-password \
            -dname "CN=REEX IDE X, OU=REEX, O=REEX, L=World, ST=NA, C=US"

          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias reex_release \
            --ks-pass pass:reex-release-password \
            --key-pass pass:reex-release-password \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 21 "$SIGNED"
          sha256sum "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: reex-ide-x-signed-release-1.2.0
          path: app/build/outputs/apk/release/REEX-IDE-X-1.2.0-release.apk
          if-no-files-found: error
