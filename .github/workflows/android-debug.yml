name: REEX IDE X - Verified Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Inspect Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$ANDROID_HOME"
          find "$ANDROID_HOME" -type f \( -name sdkmanager -o -name aapt2 -o -name zipalign \) | head -30
      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Clean and build debug
        run: gradle clean assembleDebug --no-daemon --stacktrace
      - name: Build release unsigned
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD="$ANDROID_HOME/build-tools/35.0.0"
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG"
          test -s "$RELEASE"
          "$SDK_BUILD/aapt2" dump badging "$DEBUG" | tee /tmp/debug-badging.txt
          grep -q "package: name='com.reex.idex'" /tmp/debug-badging.txt
          grep -Eq "minSdkVersion:'(21|23)'" /tmp/debug-badging.txt
          "$SDK_BUILD/zipalign" -c -P 16 -v 4 "$DEBUG"
          sha256sum "$DEBUG" "$RELEASE"
          mkdir -p verified-apks
          cp "$DEBUG" verified-apks/REEX-IDE-X-debug.apk
          cp "$RELEASE" verified-apks/REEX-IDE-X-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: REEX-IDE-X-verified-apks
          path: verified-apks/
          if-no-files-found: error
