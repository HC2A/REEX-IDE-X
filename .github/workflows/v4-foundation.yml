name: REEX IDE X v4 Foundation

on:
  push:
    branches:
      - reex-ide-v4-offline-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare embedded Flutter module
        working-directory: flutter_module
        run: |
          flutter pub get
          test -f .android/include_flutter.groovy
          flutter build aar

      - name: Android SDK verification
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list_installed

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Android release
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          sha256sum "$APK" | tee apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reex-ide-x-v4-arm64-release
          path: |
            app/build/outputs/apk/**/*.apk
            apk.sha256
