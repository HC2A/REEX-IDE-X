name: REEX IDE X v4 Foundation

on:
  push:
    branches:
      - reex-ide-v4-offline-foundation
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Android SDK verification
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed

      - name: Build Android release
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reex-ide-x-v4-arm64-release
          path: |
            app/build/outputs/apk/**/*.apk
            apk.sha256
